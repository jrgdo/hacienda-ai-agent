name: Validar plantilla

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar privacidad
        run: python3 herramientas/comprobar_privacidad.py --tracked
      - name: Ejecutar pruebas
        run: python3 -m unittest discover -s tests
